name: ConsultaPlus CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        working-directory: ./codigo
        run: dotnet restore ConsultaPlus.sln
      - name: Build
        working-directory: ./codigo
        run: dotnet build ConsultaPlus.sln -c Release --no-restore

  test:
    name: Test (.NET 8) + Coverage
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        working-directory: ./codigo
        run: dotnet restore ConsultaPlus.sln

      - name: Build (for tests)
        working-directory: ./codigo
        run: dotnet build ConsultaPlus.sln -c Release --no-restore

      # --- testes + cobertura (gera cobertura.cobertura.xml em TestResults) ---
      - name: Run tests with coverage (Cobertura)
        working-directory: ./codigo
        run: |
          dotnet test ./ConsultaPlus.Tests/ConsultaPlus.Tests.csproj \
            -c Release --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --settings ../coverlet.runsettings
            
      # --- relatório HTML (igual ao das imagens) ---
      - name: Generate HTML coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5.4.4
        with:
          reports: './codigo/TestResults/**/coverage.cobertura.xml'
          targetdir: 'coverage-report'
          reporttypes: 'HtmlInline_AzurePipelines;Cobertura'
          classfilters: '-ConsultaPlus.API.DTOs.*;-ConsultaPlus.Core.Models.*'

      # artefactos: relatório HTML
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report

      # artefactos: resultados .trx
      - name: Upload test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: './codigo/**/TestResults/*.trx'

  publish_container:
    name: Publish Container Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Docker Hub login
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      - name: Publish container image
        working-directory: ./codigo
        run: dotnet publish ./ConsultaPlus.API/ConsultaPlus.API.csproj -c Release -t:PublishContainer
