name: ConsultaPlus CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        working-directory: ./codigo
        run: dotnet restore ConsultaPlus.sln
      - name: Build
        working-directory: ./codigo
        run: dotnet build ConsultaPlus.sln -c Release --no-restore

  test:
    name: Test (.NET 8) + Coverage (unit & integration)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        working-directory: ./codigo
        run: dotnet restore ConsultaPlus.sln

      - name: Build (for tests)
        working-directory: ./codigo
        run: dotnet build ConsultaPlus.sln -c Release --no-restore

    # -------- UNIT --------
      - name: Run UNIT tests with coverage
        working-directory: ./codigo
        run: |
          dotnet test ./ConsultaPlus.Tests/ConsultaPlus.Tests.csproj \
          -c Release --no-build \
          --filter "FullyQualifiedName!~Integracao" \
          --collect:"XPlat Code Coverage" \
          --results-directory ./TestResults/unit \
          --settings ../coverlet.runsettings

      - name: Generate UNIT coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5.4.4
        with:
          reports: './codigo/TestResults/unit/**/coverage.cobertura.xml'
          targetdir: 'coverage-report-unit'
          reporttypes: 'HtmlInline_AzurePipelines;Cobertura'
          classfilters: '-ConsultaPlus.API.DTOs.*;-ConsultaPlus.Core.Models.*;-ConsultaPlus.Infrastructure.Repositories.*;-ConsultaPlus.Infrastructure.UoW.*'
          filefilters: '-*/Migrations/*;-*DbContextModelSnapshot.cs;-*ApplicationDbContextFactory.cs;-*Program.cs'

      - name: Upload UNIT coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-unit
          path: coverage-report-unit

    # -------- INTEGRAÇÃO --------
      - name: Run INTEGRATION tests with coverage
        working-directory: ./codigo
        run: |
            dotnet test ./ConsultaPlus.Tests/ConsultaPlus.Tests.csproj \
            -c Release --no-build \
            --filter "FullyQualifiedName~Integracao" \
            /p:CollectCoverage=true \
            /p:CoverletOutput=TestResults/integration/coverage.cobertura.xml \
            /p:CoverletOutputFormat=cobertura \
            /p:Exclude="[ConsultaPlus.Tests]*" \
            /p:Include="[ConsultaPlus.API]*,[ConsultaPlus.Infrastructure]*,[ConsultaPlus.Core]*"


      - name: Generate INTEGRATION coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5.4.4
        with:
          reports: './codigo/TestResults/integration/**/coverage.cobertura.xml'
          targetdir: 'coverage-report-integration'
          reporttypes: 'HtmlInline_AzurePipelines;Cobertura'
          classfilters: '-ConsultaPlus.API.DTOs.*;-ConsultaPlus.Core.Models.*;-ConsultaPlus.Infrastructure.Repositories.*;-ConsultaPlus.Infrastructure.UoW.*'
          filefilters: '-*/Migrations/*;-*DbContextModelSnapshot.cs;-*ApplicationDbContextFactory.cs;-*Program.cs'

      - name: Upload INTEGRATION coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-integration
          path: coverage-report-integration

    # (opcional) resultados .trx de ambos
      - name: Upload test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: './codigo/**/TestResults/*.trx'


  publish_container:
    name: Publish Container Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Docker Hub login
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      - name: Publish container image
        working-directory: ./codigo
        run: dotnet publish ./ConsultaPlus.API/ConsultaPlus.API.csproj -c Release -t:PublishContainer
