name: ConsultaPlus CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    name: Build and Test (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'  

      - name: Restore dependencies
        working-directory: ./codigo
        run: dotnet restore ConsultaPlus.sln

      - name: Build solution
        working-directory: ./codigo
        run: dotnet build ConsultaPlus.sln --configuration Release --no-restore

      - name: Run tests
        working-directory: ./codigo
        run: dotnet test ConsultaPlus.Tests/ConsultaPlus.Tests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test_results.trx"

      - name: Upload test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  publish_container:
    name: Publish Container Image (no Dockerfile)
    needs: build_and_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Docker Hub login
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Publish container image
        working-directory: ./codigo
        run: dotnet publish ./ConsultaPlus.API/ConsultaPlus.API.csproj -c Release -t:PublishContainer

      - name: Show built images (debug)
        run: docker images | sed -n '1,80p'

      - name: Retag and push (latest + short-sha)
        shell: bash
        run: |
          set -e
          USER="${{ secrets.DOCKERHUB_USERNAME }}"
          TARGET="$USER/consultaplus"
          TAG="${GITHUB_SHA::7}"

          # Se já veio com namespace correto, OK; senão, retag a partir de 'consultaplus:latest'
          if docker image inspect "$TARGET:latest" >/dev/null 2>&1; then
            echo "Found $TARGET:latest"
          elif docker image inspect "consultaplus:latest" >/dev/null 2>&1; then
            docker tag consultaplus:latest "$TARGET:latest"
          else
            echo "Image 'consultaplus:latest' not found"; docker images; exit 1
          fi

          # cria sempre uma tag única por commit
          docker tag "$TARGET:latest" "$TARGET:$TAG"

          echo "Pushing $TARGET:$TAG and $TARGET:latest"
          docker push "$TARGET:$TAG"
          docker push "$TARGET:latest"
